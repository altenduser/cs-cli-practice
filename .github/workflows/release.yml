name: Build and Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - name: Linux x64 (Mint, Arch, Ubuntu, etc.)
            os: ubuntu-latest
            dotnet-rid: linux-x64
            asset_name: cs-cli-linux-x64
          - name: Linux ARM64
            os: ubuntu-latest
            dotnet-rid: linux-arm64
            asset_name: cs-cli-linux-arm64
          - name: Windows x64
            os: windows-latest
            dotnet-rid: win-x64
            asset_name: cs-cli-win-x64.exe
          - name: macOS Intel
            os: macos-latest
            dotnet-rid: osx-x64
            asset_name: cs-cli-macos-x64
          - name: macOS Apple Silicon
            os: macos-latest
            dotnet-rid: osx-arm64
            asset_name: cs-cli-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Binaries
        run: |
          dotnet publish -c Release -r ${{ matrix.dotnet-rid }} --self-contained true -p:PublishSingleFile=true -o output

      - name: Prepare Asset
        shell: bash
        run: |
          mkdir -p final_output
          if [ "${{ matrix.dotnet-rid }}" == "win-x64" ]; then
            cp output/*.exe final_output/${{ matrix.asset_name }}
          else
            cp output/* final_output/${{ matrix.asset_name }}
          fi

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v1
        with:
          files: final_output/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}